[package]
name = "omniphp"
version = "0.1.0"
edition = "2024"

[dependencies]
# gpui-kit releases weekly and pins an exact GPUI snapshot; upgrade deliberately.
gpui-kit = "=0.10.0"
anyhow = "1"
async-channel = "2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
pem = "4"
rcgen = { version = "0.14.10", features = ["x509-parser", "pem"] }
sha1 = "0.11.0"
time = "0.3.55"
ureq = "3.5.2"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3"

# Keep the UI responsive in debug builds (from the gpui-kit installation guide).
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[build-dependencies]
winresource = "0.1.34"
